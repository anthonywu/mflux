name: Tests and Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      # Ruff version pinned to .pre-commit-config.yaml (rev: v0.12.1)
      - name: Run ruff
        run: |
          uvx ruff@0.12.1 check src tests
          uvx ruff@0.12.1 format --check src tests

  tests:
    runs-on: macos-14  # Apple Silicon runner (M1)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e .
          uv pip install pytest

      - name: Run tests (everything except slow/high_memory_requirement)
        run: |
          source .venv/bin/activate
          python -m pytest -m "not slow and not high_memory_requirement" -v

