name: Tests and Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: "0.12.4"  # pinned uv: makes uv.lock rendering reproducible

      # Ruff version pinned to the dev dependency in pyproject.toml and .pre-commit-config.yaml.
      # Kept as uvx (not uv run) so the lint job stays fast — no full venv.
      - name: Run ruff
        run: |
          uvx ruff@0.16.3 check src tests
          uvx ruff@0.16.3 format --check src tests

  tests:
    runs-on: macos-14  # Apple Silicon runner (M1)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"  # newest fully-supported version; pure-python wheel build makes the runtime floor ruff's job

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: "0.12.4"  # pinned uv: makes uv.lock rendering reproducible

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e .
          uv pip install pytest

      - name: Run tests (everything except slow/high_memory_requirement)
        run: |
          source .venv/bin/activate
          python -m pytest -m "not slow and not high_memory_requirement" -v

  py310-smoke:
    # Cheap floor guard: ruff target-version catches 3.11+ syntax, but not
    # 3.10-incompatible dependency markers or import-time stdlib usage.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.10 (requires-python floor)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: "0.12.4"

      - name: Resolve + byte-compile under 3.10
        run: |
          uv pip install --system --dry-run --python python -e .
          python -m compileall -q src

