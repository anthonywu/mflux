name: Tests and Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: "0.12.4"  # pinned uv: makes uv.lock rendering reproducible

      # Ruff version pinned to the dev dependency in pyproject.toml and .pre-commit-config.yaml.
      # Kept as uvx (not uv run) so the lint job stays fast — no full venv.
      - name: Run ruff
        run: |
          uvx ruff@0.16.3 check src tests
          uvx ruff@0.16.3 format --check src tests

  tests:
    runs-on: macos-14  # Apple Silicon runner (M1)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # setup-uv subsumes setup-python: UV_PYTHON pins the interpreter,
      # activate-environment creates + PATH-activates .venv for later steps.
      - name: Install uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: "0.12.4"  # pinned uv: makes uv.lock rendering reproducible
          python-version: "3.13"  # newest fully-supported version
          activate-environment: true

      - name: Install dependencies
        run: |
          uv pip install -e .
          uv pip install pytest

      - name: Run tests (everything except slow/high_memory_requirement)
        run: |
          python -m pytest -m "not slow and not high_memory_requirement" -v

  py310-smoke:
    # Cheap floor guard: ruff target-version catches 3.11+ syntax, but not
    # 3.10-incompatible dependency markers or import-time stdlib usage.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.10 (requires-python floor)
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: "0.12.4"
          python-version: "3.10"
          activate-environment: true

      - name: Resolve + byte-compile under 3.10
        run: |
          uv pip install --dry-run -e .
          python -m compileall -q src

