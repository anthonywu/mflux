name: Tests and Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          version: "latest"

      # Ruff version pinned to the dev dependency in pyproject.toml and .pre-commit-config.yaml.
      # Kept as uvx (not uv run) so the lint job stays fast — no full venv.
      - name: Run ruff
        run: |
          uvx ruff@0.16.3 check src tests
          uvx ruff@0.16.3 format --check src tests

  tests:
    runs-on: macos-14  # Apple Silicon runner (M1)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"  # newest fully-supported version; pure-python wheel build makes the runtime floor ruff's job

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e .
          uv pip install pytest

      - name: Run tests (everything except slow/high_memory_requirement)
        run: |
          source .venv/bin/activate
          MFLUX_PRESERVE_TEST_OUTPUT=1 python -m pytest -m "not slow and not high_memory_requirement" -v

